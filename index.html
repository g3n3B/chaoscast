<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CHAOS//CAST</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 32px;
    }

    #logo {
      font-size: 64px;
      color: #cc0000;
      letter-spacing: 6px;
      text-shadow: 0 0 20px #ff000088, 0 0 60px #ff000033;
    }

    #tagline {
      font-size: 16px;
      color: #666;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #play-btn {
      margin-top: 16px;
      padding: 14px 48px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 20px;
      letter-spacing: 4px;
      background: transparent;
      color: #cc0000;
      border: 2px solid #cc0000;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }

    #play-btn:hover {
      background: #cc0000;
      color: #0a0a0a;
      box-shadow: 0 0 24px #ff000088;
    }
  </style>
</head>
<body>

  <div id="logo">CHAOS//CAST</div>
  <div id="tagline">Roll the bones. Claim the void.</div>
  <button id="play-btn">PLAY</button>

  <script>
    document.getElementById('play-btn').addEventListener('click', () => {
      // will load battle screen
      window.location.href = 'battle.html';
    });
  </script>

</body>
</html>
